name = "pilgrim-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "Just Ask"
BOT_USERNAME = "just_ask_ai_bot"
WEBAPP_URL = "https://pilgrim-web.pages.dev"
LLM_MODEL = "google/gemini-3.8-flash"
STT_MODEL = "openai/gpt-4o-transcribe"
TTS_MODEL = "x-ai/grok-voice-tts-1.0"
TTS_VOICE = "ara"

[[d1_databases]]
binding = "DB"
database_name = "pilgrim"
database_id = "354701e1-569b-4106-b13c-ff1d7e87b986"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "3d023c9a80fd47628b9b165d30f38368"

[triggers]
crons = ["*/5 * * * *"]

# Секреты (wrangler secret put): BOT_TOKEN, OPENROUTER_API_KEY, INGEST_SECRET, BOT_WEBHOOK_SECRET
